# Builds the Windows download on GitHub from this code. Release downloads only ever come from
# here (never from someone's own PC), so anyone can check where a download came from.
#
# - Pushing a version tag (e.g. v0.9.10-beta) builds it, signs the .exe once SignPath is set
#   up, records a signed attestation (this workflow built this zip from this commit), checks
#   that attestation itself, and makes a DRAFT release with the zip and its SHA-256. A person
#   reads it over and publishes it. A release that's already published is never changed from
#   here.
# - "Run workflow" (Actions tab) just builds, and leaves the zip on the run's page. With
#   "release" ticked (from main only), it also makes the version tag (v + VERSION in
#   maple_exp.py) once the build has passed, and the draft release, as a pushed tag would:
#   no Git needed on anyone's PC.
# - The "mac" job then builds the Mac app the same way (with its own Tesseract), checks that
#   it starts, and for a release adds its zip (and its SHA-256) to that draft release.
#
# The zip is kept on the run's page as it is (not wrapped in another zip, which GitHub does
# to artifacts unless told not to), so the SHA-256 shown there is the zip's own SHA-256: the
# same as SHA256SUMS.txt and the release page.
#
# Check a download:   gh attestation verify <the zip> --repo guddevbaddev/Maple-Classic-Exp-Overlay
#
# Signing switches on once SignPath has accepted the project: add the secret
# SIGNPATH_API_TOKEN and the variable SIGNPATH_ORGANIZATION_ID (Settings > Secrets and
# variables > Actions). Until then that step is skipped and the build is unsigned.
#
# Actions are pinned to exact commits (a version tag can be moved; a commit can't).
name: Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Make the release: tag this version (v + VERSION in maple_exp.py) and draft its release. From main only."
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write             # the draft release (version tags only)
      id-token: write             # signing the attestation
      attestations: write
      artifact-metadata: write
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}     # the release this run makes, or empty
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Which release this is (a pushed tag, or "release" ticked), matching the program's version
        id: tag
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' maple_exp.py)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::The tag is $GITHUB_REF_NAME but maple_exp.py says VERSION = $version. Fix one, and tag again."
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Releases are only made from main (this run is on $GITHUB_REF_NAME)."
              exit 1
            fi
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.10"
      - name: Install the packages (exact files, each checked by its SHA-256)
        run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Install Tesseract OCR
        run: choco install tesseract --version 5.5.0.20241111 -y --no-progress
      - name: Tests
        run: |
          python tests/test_logic.py
          python tests/test_screen.py
          python tests/test_ocr.py
          python tests/test_report.py
          python tests/test_update.py
      - name: Build
        run: python build.py
      - name: Keep the unsigned build
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unsigned
          path: build/dist/Maple Classic Exp Overlay
      - name: Sign the .exe (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627  # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: maple-classic-exp-overlay
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Zip the signed build
        if: env.SIGNPATH_API_TOKEN != ''
        run: python build.py zip signed
      - name: SHA-256 of the download
        id: sum
        shell: bash
        run: |
          cd release
          sha256sum --text *.zip | tee SHA256SUMS.txt
          echo "zip=release/$(ls *.zip)" >> "$GITHUB_OUTPUT"
          { echo "### The download"; echo; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Record where the download came from (attestation)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ steps.sum.outputs.zip }}
      - name: Check the attestation (the build proves itself)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.sum.outputs.zip }}
        run: |
          for try in 1 2 3 4 5 6; do
            if gh attestation verify "$ZIP" --repo "$GITHUB_REPOSITORY" \
                 --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::The attestation doesn't verify."
          exit 1
      - name: Keep the download on this run's page (the zip itself, not wrapped in another zip)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: ${{ steps.sum.outputs.zip }}
          archive: false
      - name: Keep the checksum on this run's page
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: release/SHA256SUMS.txt
          archive: false
      - name: Draft the release
        if: steps.tag.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          ZIP: ${{ steps.sum.outputs.zip }}
        run: |
          # "release" ticked: make the tag now that the build has passed, on the commit it built.
          # (A tag made with this run's token doesn't start this workflow again.)
          # (gh api prints GitHub's error message to stdout when there's no such tag: go by its exit code)
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>/dev/null); then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG is already on another commit ($existing). Raise VERSION in maple_exp.py for a new release."
              exit 1
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
            echo "Made the tag $TAG on $GITHUB_SHA"
          fi
          name=$(basename "$ZIP")
          hash=$(sha256sum "$ZIP" | cut -d' ' -f1)
          title="Maple Classic Exp Overlay $(echo "$TAG" | sed -E 's/-beta$/ (beta)/')"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > notes.md <<'EOF'
          (Notes to come.)

          ---
          **Check this download**
          - SHA-256 of __NAME__: `__HASH__` (also in SHA256SUMS.txt). In PowerShell: `Get-FileHash .\__NAME__`
          - Built by GitHub from this tag, not on a PC. Check it with the GitHub CLI: `gh attestation verify __NAME__ --repo __REPO__`
          - The same file is on [the build's page](__RUN__), where GitHub shows the same SHA-256.
          EOF
          sed -i -e "s|__NAME__|$name|g" -e "s|__HASH__|$hash|g" -e "s|__REPO__|$GITHUB_REPOSITORY|g" -e "s|__RUN__|$run|g" notes.md
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = "none" ]; then
            gh release create "$TAG" "$ZIP" release/SHA256SUMS.txt --draft --verify-tag --title "$title" --notes-file notes.md
          elif [ "$state" = "true" ]; then
            gh release upload "$TAG" "$ZIP" release/SHA256SUMS.txt --clobber
            if gh release view "$TAG" --json body --jq .body | grep -q '(Notes to come.)'; then
              gh release edit "$TAG" --notes-file notes.md
            else
              echo "::warning::The draft's notes were already written. If they show a SHA-256, update it to: $hash"
            fi
          else
            echo "::warning::$TAG is already published, so it's left as it is. The build is on this run's page."
            exit 0
          fi
          # What's on the draft must be exactly what was built.
          mkdir check
          gh release download "$TAG" --pattern "$name" --dir check
          (cd check && sha256sum --check ../release/SHA256SUMS.txt)

  mac:
    # The Mac download: the same code as an .app for Apple Silicon Macs, with its own Tesseract.
    # It runs after the Windows build, so on a version tag the draft release is already there
    # to add the Mac zip to.
    needs: build
    runs-on: macos-14            # the oldest macOS the app runs on: Homebrew's Tesseract is built for the one it's on
    permissions:
      contents: write             # adding to the draft release (version tags only)
      id-token: write             # signing the attestation
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install the packages (exact files, each checked by its SHA-256)
        run: python -m pip install --require-hashes -r requirements-build-mac.txt
      - name: Install Tesseract OCR and dylibbundler
        run: brew install tesseract dylibbundler ninja
      - name: Tests
        run: |
          python tests/test_logic.py
          python tests/test_screen.py
          python tests/test_ocr.py
          python tests/test_report.py
          python tests/test_update.py
      - name: Build Tesseract for macOS 14.0 (Homebrew's is built for the macOS it's on)
        # The app's Tesseract must run on every macOS the app does. Homebrew builds Tesseract
        # for the runner's own macOS (14.8 here), so it's built from Tesseract's own source,
        # at a commit checked here, for macOS 14.0. libtesseract goes in the program itself;
        # only Homebrew's Leptonica (built for 14.0) comes along as a library.
        shell: bash
        run: |
          src="$RUNNER_TEMP/tesseract-src"; out="$RUNNER_TEMP/tesseract"
          git clone --quiet --depth 1 --branch 5.5.3 https://github.com/tesseract-ocr/tesseract "$src"
          commit=$(git -C "$src" rev-parse HEAD)
          if [ "$commit" != "db0ec62f81b0737fbbe184d8fea40af5738f8eef" ]; then
            echo "::error::Tesseract 5.5.3 isn't the commit it was checked as ($commit)."
            exit 1
          fi
          cmake -S "$src" -B "$src/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DCMAKE_PREFIX_PATH="$(brew --prefix leptonica)" \
            -DCMAKE_INSTALL_PREFIX="$out" -DBUILD_SHARED_LIBS=OFF -DBUILD_TRAINING_TOOLS=OFF \
            -DGRAPHICS_DISABLED=ON -DDISABLE_CURL=ON -DDISABLE_ARCHIVE=ON -DDISABLE_TIFF=ON \
            -DENABLE_NATIVE=OFF -DENABLE_CCACHE=OFF -DOPENMP_BUILD=OFF -DINSTALL_CONFIGS=OFF
          cmake --build "$src/build"
          cmake --install "$src/build"
          cp "$src/LICENSE" "$out/LICENSE"
          echo "TESSERACT_BIN=$out/bin/tesseract" >> "$GITHUB_ENV"
          echo "TESSDATA_DIR=$(brew --prefix tesseract)/share/tessdata" >> "$GITHUB_ENV"
      - name: Build
        run: python build.py
      - name: The app starts, and keeps running
        shell: bash
        run: |
          app="build/dist/Maple Classic Exp Overlay.app/Contents/MacOS/Maple Classic Exp Overlay"
          export MAPLE_EXP_DATA="$RUNNER_TEMP/overlay-data"
          mkdir -p "$MAPLE_EXP_DATA"
          # (with the settings a new player has: no config file, so the update check runs too, and a
          # failed check is written in errors.log. Its Python's own certificates are hidden, as on a
          # player's Mac, where they don't exist: the check must work with macOS's alone.)
          SSL_CERT_FILE=/nonexistent SSL_CERT_DIR=/nonexistent "$app" & pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::The app closed by itself within 20 seconds."
            cat "$MAPLE_EXP_DATA/errors.log" 2>/dev/null
            exit 1
          fi
          kill "$pid"
          if [ -s "$MAPLE_EXP_DATA/errors.log" ]; then
            cat "$MAPLE_EXP_DATA/errors.log"
            echo "::error::The app wrote errors while starting."
            exit 1
          fi
      - name: SHA-256 of the download
        id: sum
        shell: bash
        run: |
          cd release
          shasum -a 256 *-mac.zip | tee SHA256SUMS-mac.txt
          echo "zip=release/$(ls *-mac.zip)" >> "$GITHUB_OUTPUT"
          { echo "### The Mac download"; echo; echo '```'; cat SHA256SUMS-mac.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Record where the download came from (attestation)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ steps.sum.outputs.zip }}
      - name: Keep the download on this run's page (the zip itself, not wrapped in another zip)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: ${{ steps.sum.outputs.zip }}
          archive: false
      - name: Add it to the draft release
        if: needs.build.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          ZIP: ${{ steps.sum.outputs.zip }}
        run: |
          name=$(basename "$ZIP")
          hash=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" != "true" ]; then
            echo "::warning::$TAG isn't a draft release ($state), so it's left as it is. The Mac build is on this run's page."
            exit 0
          fi
          # One SHA256SUMS.txt for both downloads.
          mkdir sums
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir sums || touch sums/SHA256SUMS.txt
          grep -v -- '-mac\.zip' sums/SHA256SUMS.txt > sums/all.txt || true
          cat release/SHA256SUMS-mac.txt >> sums/all.txt
          mv sums/all.txt sums/SHA256SUMS.txt
          gh release upload "$TAG" "$ZIP" sums/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if ! printf '%s' "$body" | grep -q -- "$name"; then
            printf '%s\n- SHA-256 of %s (Mac): `%s`\n' "$body" "$name" "$hash" > notes.md
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi
          # What's on the draft must be exactly what was built.
          mkdir check
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir check
          (cd check && shasum -a 256 -c ../release/SHA256SUMS-mac.txt)
